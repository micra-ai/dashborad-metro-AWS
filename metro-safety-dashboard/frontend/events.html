<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - Metro Visión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            background: #1f2937;
            padding: 1rem;
            border-radius: 8px;
            align-items: flex-end;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        .filter-group label {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 0.25rem;
        }
        .filter-group select, .filter-group input {
            padding: 0.5rem;
            background: #111827;
            border: 1px solid #374151;
            color: white;
            border-radius: 4px;
        }
        .btn {
            padding: 0.5rem 1rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover { background-color: #2563eb; }
        .btn-export { background-color: #059669; }
        .btn-export:hover { background-color: #047857; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1f2937;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #374151;
        }
        th {
            background: #111827;
            color: #9ca3af;
            font-weight: 600;
        }
        tr:hover { background-color: #374151; }
    </style>







<style id="events-sidebar-spacing-fix">

    body .sidebar nav {

        display: flex !important;

        flex-direction: column !important;

        gap: 0 !important;

        width: 100% !important;

    }



    body .sidebar nav a {

        display: block !important;

        width: 100% !important;

        padding: 13px 16px !important;

        margin: 0 0 14px 0 !important;

        border-radius: 10px !important;

        text-decoration: none !important;

        line-height: 1.25 !important;

        font-size: 1rem !important;

        box-sizing: border-box !important;

        background: transparent !important;

        color: #cbd5e1 !important;

        font-weight: 500 !important;

    }



    body .sidebar nav a.active {

        background: #374151 !important;

        color: #ffffff !important;

        font-weight: 800 !important;

    }



    body .sidebar nav a:hover {

        background: #374151 !important;

        color: #ffffff !important;

    }

</style>


<script src="js/time_chile.js"></script>
</head>
<body>

        <ul class="nav-links">

    <div class="main-content">
        <header>
            <h1>Histórico de Eventos</h1>
        </header>

        <div class="filters">
            <div class="filter-group">
                <label>Tipo de Evento</label>
                <select id="filter-type">
                    <option value="">Todos</option>
                    <option value="EPP_DETECTION">EPP</option>
                    <option value="EXCAVATION_RISK_DETECTION">Excavación</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Dispositivo</label>
                <input type="text" id="filter-device" placeholder="ID Dispositivo">
            </div>
            <button class="btn" onclick="loadEvents()">Filtrar</button>
            <div style="display:flex; gap:10px; margin-left:auto; flex-wrap:wrap;">

    <button class="btn btn-export" onclick="exportCSV()">

        Descargar alertas EPP

    </button>



    



    

</div>
        </div>

        <table>
            

<thead>

    <tr>

        <th>Fecha</th>

        <th>Dispositivo</th>

        <th>Trabajadores</th>

        <th>EPP faltante</th>

        <th>Nivel</th>

        <th>Evidencia</th>

    </tr>

</thead>


            <tbody id="events-table-body">
                <!-- Data will be populated here -->
            </tbody>
        </table>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>

<script src="js/user_sidebar.js"></script>
