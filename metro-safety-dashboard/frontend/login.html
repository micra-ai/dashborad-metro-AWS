<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso · Metro Línea 9</title>

  <style>
    :root {
      --background: #0b0f12;
      --surface: #151b1f;
      --surface-soft: #1c2429;
      --border: #303a40;
      --text: #f4f6f7;
      --muted: #9eabb2;
      --orange: #ff6518;
      --orange-hover: #e95710;
      --green: #38d996;
      --danger: #ff6464;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 10%, rgba(255, 101, 24, 0.09), transparent 31rem),
        linear-gradient(135deg, #0b0f12 0%, #11171b 55%, #090c0e 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .login-shell {
      width: min(100%, 460px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      background: var(--orange);
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(255, 101, 24, 0.2);
    }

    .brand-copy b,
    .brand-copy small {
      display: block;
    }

    .brand-copy b {
      letter-spacing: 0.18em;
      font-size: 21px;
    }

    .brand-copy small {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .login-card {
      padding: 34px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(21, 27, 31, 0.96);
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.38);
    }

    .eyebrow {
      display: block;
      margin-bottom: 8px;
      color: var(--orange);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
    }

    .intro {
      margin: 10px 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #c6d0d5;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      color: var(--text);
      background: #0d1215;
      font: inherit;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:hover {
      border-color: #465158;
    }

    input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255, 101, 24, 0.14);
    }

    .btn {
      width: 100%;
      min-height: 52px;
      margin-top: 4px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      color: #fff;
      background: var(--orange);
      font-size: 15px;
      font-weight: 800;
      transition: background 160ms ease, transform 160ms ease;
    }

    .btn:hover {
      background: var(--orange-hover);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    #error-msg {
      min-height: 20px;
      margin-top: 14px;
      color: var(--danger);
      text-align: center;
      font-size: 13px;
    }

    .system-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(56, 217, 150, 0.1);
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 26px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="login-shell">
    <div class="brand">
      <div class="brand-mark">L9</div>
      <div class="brand-copy">
        <b>METRO</b>
        <small>Control operacional</small>
      </div>
    </div>

    <section class="login-card">
      <span class="eyebrow">OPERACIÓN / LÍNEA 9</span>
      <h1>Acceso al sistema</h1>
      <p class="intro">
        Ingresa tus credenciales para acceder al monitoreo operacional del Frente Norte.
      </p>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn" id="submit-button">
          Ingresar al sistema
        </button>

        <div id="error-msg" role="alert" aria-live="polite"></div>
      </form>
    </section>

    <div class="system-status">
      <span class="status-dot"></span>
      Acceso restringido · Línea 9
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const submitButton = document.getElementById('submit-button');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      errorMsg.textContent = '';
      submitButton.disabled = true;
      submitButton.textContent = 'Verificando…';

      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: new URLSearchParams({ username, password })
        });

        if (!response.ok) {
          throw new Error('Usuario o contraseña incorrectos');
        }

        const data = await response.json();

        localStorage.setItem('token', data.access_token);
        localStorage.setItem('username', username);
        window.location.href = 'dashboard.html';
      } catch (error) {
        errorMsg.textContent = error.message || 'No fue posible iniciar sesión';
        submitButton.disabled = false;
        submitButton.textContent = 'Ingresar al sistema';
      }
    });
  </script>
</body>
</html>
