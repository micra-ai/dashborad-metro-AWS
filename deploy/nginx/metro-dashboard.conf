# Servidor HTTP por IP o host desconocido

server {

    listen 80 default_server;

    server_name _;



    root /var/www/metro-dashboard;

    index index.html dashboard.html;



    # Compatibilidad temporal:

    # /api/api/epp/events -> /api/epp/events

    location ^~ /api/api/ {

        proxy_pass http://127.0.0.1:8000/api/;



        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

    }



    location /api/ {

        proxy_pass http://127.0.0.1:8000;



        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

    }



    location /auth/ {

        proxy_pass http://127.0.0.1:8000;



        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

    }



    location /static/ {

        proxy_pass http://127.0.0.1:8000;



        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

    }



    location = /openapi.json {

        proxy_pass http://127.0.0.1:8000/openapi.json;



        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

    }



    location ~* \.(js|css|html)$ {

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

        expires off;

        try_files $uri =404;

    }



    location / {

        try_files $uri $uri/ /index.html;

    }

}





# Redirección HTTP a HTTPS para los dominios

server {

    listen 80;



    server_name metrovision.duckdns.org 100-29-228-117.sslip.io;



    return 301 https://$host$request_uri;

}





# Servidor HTTPS

